[tool.poetry]
name = "intraday-stock-scanner"
version = "0.1.0"
description = "MVP scanner for US intraday manual trading plans"
authors = ["Codex <codex@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
polars = "^1.6.0"
pandas = "^2.2.2"
httpx = "^0.27.0"
websockets = "^12.0"
sqlalchemy = "^2.0.30"
pyyaml = "^6.0.1"
loguru = "^0.7.2"
typer = "^0.12.3"
python-dateutil = "^2.9.0.post0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
